name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            qa: true
          - os: macos-latest
            target: x86_64-apple-darwin
            qa: false # cross-compiled; QA runs on the native arm64 build
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            qa: true
    runs-on: ${{ matrix.os }}
    env:
      QA_OUT: ${{ github.workspace }}/qa-out
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: npm ci

      - name: Build
        run: npx tauri build --target ${{ matrix.target }}

      # UI tests are timing sensitive on shared runners: one retry.
      - name: QA
        if: matrix.qa
        shell: bash
        run: |
          BIN=src-tauri/target/${{ matrix.target }}/release/eftconsole
          [ "$RUNNER_OS" = Windows ] && BIN="$BIN.exe"
          node scripts/qa.js "$BIN" || node scripts/qa.js "$BIN"

      - uses: actions/upload-artifact@v4
        if: always() && matrix.qa
        with:
          name: qa-log-${{ matrix.target }}
          path: qa-out/qa.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: EFTconsole-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
