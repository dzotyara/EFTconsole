name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            qa: true
          - os: macos-latest
            target: x86_64-apple-darwin
            qa: false # cross-compiled; QA runs on the native arm64 build
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            qa: true
          # 22.04 keeps the glibc floor low so the AppImage runs on older distros.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            qa: true
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            qa: false
    runs-on: ${{ matrix.os }}
    env:
      QA_OUT: ${{ github.workspace }}/qa-out
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf file rpm xvfb zsh

      - run: npm ci

      - name: Build
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS) BUNDLES=dmg ;;
            Windows) BUNDLES=nsis ;;
            Linux) BUNDLES=deb,rpm,appimage ;;
          esac
          npx tauri build --target ${{ matrix.target }} --bundles "$BUNDLES"

      # UI tests are timing sensitive on shared runners: one retry.
      - name: QA
        if: matrix.qa
        shell: bash
        run: |
          BIN=src-tauri/target/${{ matrix.target }}/release/eftconsole
          [ "$RUNNER_OS" = Windows ] && BIN="$BIN.exe"
          RUN=""
          if [ "$RUNNER_OS" = Linux ]; then
            RUN="xvfb-run -a"
            export WEBKIT_DISABLE_DMABUF_RENDERER=1 LIBGL_ALWAYS_SOFTWARE=1
          fi
          $RUN node scripts/qa.js "$BIN" || $RUN node scripts/qa.js "$BIN"

      - uses: actions/upload-artifact@v4
        if: always() && matrix.qa
        with:
          name: qa-log-${{ matrix.target }}
          path: qa-out/qa.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: EFTconsole-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
