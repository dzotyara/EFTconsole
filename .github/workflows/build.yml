name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QA_OUT: ${{ github.workspace }}/qa-out
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Synthesized-input UI tests are timing sensitive on shared runners: one retry.
      - name: QA (native)
        run: npm run qa || npm run qa

      - name: QA (Windows code paths, simulated)
        if: runner.os == 'macOS'
        run: npm run qa:win-sim || npm run qa:win-sim

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-screenshots-${{ runner.os }}
          path: qa-out/*.png
          if-no-files-found: ignore

  build:
    needs: qa
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Package
        run: npx electron-builder --publish never
        env:
          # No signing certificates: build unsigned binaries.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: EFTconsole-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.exe
