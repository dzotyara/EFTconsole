<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' ipc: http://ipc.localhost; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src ipc: http://ipc.localhost">
  <title>EFTconsole</title>
  <link rel="stylesheet" href="vendor/xterm.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="titlebar" data-tauri-drag-region>
      <div class="brand" data-tauri-drag-region>
        <img class="brand-icon" src="logo.svg" alt="" data-tauri-drag-region>
        <span class="brand-mark" data-tauri-drag-region>EFT</span>
        <span class="brand-name" data-tauri-drag-region>CONSOLE</span>
      </div>
      <nav id="tabs"></nav>
      <button id="new-tab" class="tb-btn" title="New tab">+</button>
      <div class="drag-spacer" data-tauri-drag-region></div>
      <button id="settings" class="tb-btn" title="Open config">&#9881;</button>
      <div id="window-controls">
        <button data-action="minimize" title="Minimize"><svg viewBox="0 0 10 10"><path d="M1 5.5h8"/></svg></button>
        <button data-action="maximize" title="Maximize"><svg viewBox="0 0 10 10"><rect x="1.5" y="1.5" width="7" height="7"/></svg></button>
        <button data-action="close" class="close" title="Close"><svg viewBox="0 0 10 10"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7"/></svg></button>
      </div>
    </header>

    <main id="stage">
      <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
      <div id="terminals"></div>
    </main>

    <footer id="statusbar">
      <div class="sb-group">
        <span class="sb-label">PMC</span><span id="sb-callsign" class="sb-value"></span>
        <span class="sb-sep"></span>
        <span class="sb-label">LOCATION</span><span id="sb-location" class="sb-value"></span>
        <span class="sb-sep"></span>
        <span class="sb-label">SHELL</span><span id="sb-shell" class="sb-value">&mdash;</span>
      </div>
      <div class="sb-group sb-meters">
        <span class="sb-label">CPU</span><span class="meter" id="m-cpu"></span><span id="v-cpu" class="sb-value num">0%</span>
        <span class="sb-label">MEM</span><span class="meter" id="m-mem"></span><span id="v-mem" class="sb-value num">0%</span>
      </div>
      <div class="sb-group">
        <span class="sb-label">IN RAID</span><span id="sb-raid" class="sb-value num">00:00:00</span>
        <span class="sb-sep"></span>
        <span id="sb-clock" class="sb-value num"></span>
      </div>
    </footer>
  </div>

  <div id="fx-noise"></div>
  <div id="fx-scanlines"></div>

  <div id="boot" hidden>
    <div class="boot-inner">
      <img class="boot-logo" src="logo.svg" alt="">
      <div class="boot-title">EFT<span>CONSOLE</span></div>
      <div class="boot-stage" id="boot-stage">ESTABLISHING CONNECTION</div>
      <div class="boot-bar"><div id="boot-progress"></div></div>
      <div class="boot-deploy">DEPLOYING IN: <span id="boot-timer">00:03.00</span></div>
    </div>
    <div class="boot-hint">PRESS ANY KEY TO SKIP</div>
  </div>

  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script src="vendor/addon-web-links.js"></script>
  <script src="bridge.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
