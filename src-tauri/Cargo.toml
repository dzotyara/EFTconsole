[package]
name = "eftconsole"
version = "0.2.0"
description = "Escape from Tarkov styled terminal (fan-made)"
license = "MIT"
repository = "https://github.com/dzotyara/EFTconsole"
edition = "2021"

[lib]
name = "eftconsole_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
sysinfo = "0.40"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
